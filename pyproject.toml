[project]
name = "whisper-transcript"
version = "0.1.0"
description = "Audio To Text using Whisper and Streamlit"
readme = "README.md"
authors = [{ name = "Marco Caimi", email = "mcaimi@redhat.com" }]
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.14.0",
  "huggingface-hub>=1.27.0",
  "matplotlib>=3.7.0",
  "numpy>=1.24.0",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "streamlit>=1.61.1",
  "torch>=2.13.0",
  "torchaudio>=2.11.0",
  "torchcodec>=0.15.0",
  "torchvision>=0.28.0",
  "transformers>=4.40.0",
]

[project.scripts]
whisper_transcript = "whisper_transcript.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
